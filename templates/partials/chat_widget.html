<button class="chat-fab" type="button" data-chat-open aria-label="Open JIMMIND AI chatbot"><span>✦</span><i></i></button>
<div class="chat-overlay" id="chatOverlay" aria-hidden="true">
  <div class="chat-shell" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <div class="chat-head">
      <div><span class="status-dot"></span><strong id="chatTitle">JIMMIND AI Assistant</strong><small data-i18n="chat_scope">Voter services &amp; consultation fees only</small></div>
      <button type="button" id="chatClose" aria-label="Close">×</button>
    </div>
    <div class="chat-messages" id="chatMessages"><div class="chat-bubble bot" data-i18n="chat_welcome">Hi! Ask me about JIMMIND AI’s voter services, eligibility guidance, process or consultation fees.</div></div>
    <form class="chat-form" id="chatForm"><input id="chatInput" autocomplete="off" maxlength="800" data-i18n-placeholder="chat_placeholder" placeholder="Ask about a voter service…"><button type="submit" aria-label="Send">↑</button></form>
  </div>
</div>
